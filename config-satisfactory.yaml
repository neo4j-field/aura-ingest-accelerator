# config-satisfactory.yaml
# =============================================================================
# Satisfactory Save-Game Import
# =============================================================================
# Loads a Satisfactory .sav file into Neo4j Aura as a raw actor/component graph.
# Run cypher/satisfactory_constraints.cypher against the target instance BEFORE
# the first import, and cypher/satisfactory_postimport.cypher AFTER the last
# job below completes (semantic labels + the collapsed SUPPLIES edge).
#
# Jobs are ordered by dependency — nodes before edges. Run the full sequence
# with (no "run" subcommand — main.py is a single-command Typer app):
#   uv run python main.py --config config-satisfactory.yaml --debug
#
# SATISFACTORY_SAVE_PATH is read from .env by SatisfactorySource — set it
# there before running. Requires the [satisfactory] extra:
#   uv pip install -e .[satisfactory]
#
# batch_size below (1000, 500 for factory_links) is the production setting,
# validated 2026-08-12 against a real ~55,000-object save on a local Neo4j
# instance at batch_size 10 first — see docs/satisfactory.md for the full
# test-run results. Drop back to a small value like 10 if you're testing
# against a new/different save for the first time.
# =============================================================================

imports:

  - name: "Save Metadata"
    source: satisfactory
    save_path: "${SATISFACTORY_SAVE_PATH}"
    extract: save
    cypher: |
      UNWIND $rows AS row
      WITH row, datetime() AS now
      MERGE (s:Save {saveId: row.saveId})
      ON CREATE SET s.createdEpochMillis = now.epochMillis,
                    s.createdDatetime    = now
      ON MATCH SET  s.modifiedEpochMillis = now.epochMillis,
                    s.modifiedDatetime    = now
      SET s.sessionName = row.sessionName,
          s.playDurationSeconds = row.playDurationSeconds,
          s.saveVersion = row.saveVersion,
          s.buildVersion = row.buildVersion,
          s.savedAtEpochMillis = row.savedAtEpochMillis
    batch_size: 1000

  - name: "Levels"
    source: satisfactory
    save_path: "${SATISFACTORY_SAVE_PATH}"
    extract: levels
    cypher: |
      UNWIND $rows AS row
      WITH row, datetime() AS now
      MERGE (l:Level {name: row.levelName})
      ON CREATE SET l.createdEpochMillis = now.epochMillis,
                    l.createdDatetime    = now
      SET l.isPersistent = row.isPersistent
      WITH l, row
      MATCH (s:Save {saveId: row.saveId})
      MERGE (s)-[:HAS_LEVEL]->(l)
    batch_size: 1000

  - name: "Classes"
    source: satisfactory
    save_path: "${SATISFACTORY_SAVE_PATH}"
    extract: classes
    cypher: |
      UNWIND $rows AS row
      WITH row, datetime() AS now
      MERGE (c:Class {typePath: row.typePath})
      ON CREATE SET c.createdEpochMillis = now.epochMillis,
                    c.createdDatetime    = now
      SET c.shortName = row.shortName,
          c.category = row.category
    batch_size: 1000

  - name: "Actors"
    source: satisfactory
    save_path: "${SATISFACTORY_SAVE_PATH}"
    extract: actors
    cypher: |
      UNWIND $rows AS row
      WITH row, datetime() AS now
      MERGE (a:Actor {instanceName: row.instanceName})
      ON CREATE SET a.createdEpochMillis = now.epochMillis,
                    a.createdDatetime    = now
      ON MATCH SET  a.modifiedEpochMillis = now.epochMillis,
                    a.modifiedDatetime    = now
      SET a.typePath = row.typePath,
          a.category = row.category,
          a.posX = row.posX, a.posY = row.posY, a.posZ = row.posZ,
          a.rotX = row.rotX, a.rotY = row.rotY, a.rotZ = row.rotZ, a.rotW = row.rotW,
          a.scaleX = row.scaleX, a.scaleY = row.scaleY, a.scaleZ = row.scaleZ
      WITH a, row
      MATCH (c:Class {typePath: row.typePath})
      MERGE (a)-[:INSTANCE_OF]->(c)
      WITH a, row
      MATCH (l:Level {name: row.levelName})
      MERGE (l)-[:CONTAINS]->(a)
    batch_size: 1000

  - name: "Inventory Stacks"
    source: satisfactory
    save_path: "${SATISFACTORY_SAVE_PATH}"
    extract: inventory_stacks
    cypher: |
      UNWIND $rows AS row
      MATCH (a:Actor {instanceName: row.ownerInstanceName})
      MERGE (i:Item {className: row.itemClass})
      MERGE (a)-[r:HOLDS]->(i)
      ON CREATE SET r.slotIndex = row.slotIndex, r.count = row.count
      ON MATCH SET  r.count = r.count + row.count
    batch_size: 1000

  - name: "Factory Links"
    source: satisfactory
    save_path: "${SATISFACTORY_SAVE_PATH}"
    extract: factory_links
    cypher: |
      UNWIND $rows AS row
      MATCH (a:Actor {instanceName: row.fromInstanceName})
      MATCH (b:Actor {instanceName: row.toInstanceName})
      MERGE (a)-[r:FEEDS]->(b)
      ON CREATE SET r.kind = row.kind
    batch_size: 500

  - name: "Power Links"
    source: satisfactory
    save_path: "${SATISFACTORY_SAVE_PATH}"
    extract: power_links
    cypher: |
      UNWIND $rows AS row
      MATCH (a:Actor {instanceName: row.instanceName})
      MERGE (p:PowerCircuit {circuitId: row.circuitId})
      MERGE (a)-[:ON_CIRCUIT]->(p)
    batch_size: 1000
